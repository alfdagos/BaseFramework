spring.application.name=sample-app

# --- Datasource (in-memory H2 for the demo) ---
spring.datasource.url=jdbc:h2:mem:sampledb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 web console available at http://localhost:8081/h2-console
spring.h2.console.enabled=true

server.port=8081

# --- OpenAPI metadata (consumed by the framework OpenAPI auto-configuration) ---
baseframework.openapi.title=Sample API
baseframework.openapi.description=Demo CRUD API built on BaseFramework
baseframework.openapi.version=v1

# --- Kafka (opt-in; the framework only wires Kafka beans when enabled) ---
baseframework.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=sample-group

# --- Security ---
# The framework secures every endpoint with HTTP Basic by default. It is disabled here to keep
# the demo (and its integration test) simple. Set to 'true' for realistic behaviour.
baseframework.security.enabled=false
