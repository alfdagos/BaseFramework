spring.datasource.url=jdbc:h2:mem:sampledb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

server.port=8081

# Kafka defaults used by the framework (change if you have a broker available)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=sample-group

# Disable the framework-provided security for the sample to simplify testing
baseframework.security.enabled=false
